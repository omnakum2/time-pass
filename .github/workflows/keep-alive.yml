name: Keep Render awake

# Render Free spins the service down after ~15 min of inactivity. Ping the
# health endpoint every 10 min so it stays warm. Also runnable on demand.
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS "$RENDER_HEALTH_URL"
        env:
          # Set this repo secret to https://<your-render-service>/health
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
